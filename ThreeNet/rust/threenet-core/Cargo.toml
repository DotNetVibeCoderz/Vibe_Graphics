[package]
name = "threenet-core"
description = "Three.Net native core engine (wgpu based renderer, scene graph, asset pipeline)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "threenet_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["gltf-lights", "basis", "audio-output", "gamepad", "xr"]
# Imports KHR_lights_punctual lights from glTF files.
gltf-lights = ["gltf/KHR_lights_punctual"]
# Basis Universal transcoding (C++; needs a C++ toolchain for the target).
basis = ["dep:basis-universal"]
# Audio device output through cpal (the mixer and decoders are always built).
audio-output = ["dep:cpal"]
# Physical gamepads through gilrs (virtual pads always work).
gamepad = ["dep:gilrs"]
# OpenXR runtime discovery (dynamic loader).
xr = ["dep:openxr"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
env_logger = "0.11.11"
glam = { version = "0.33.7", features = ["bytemuck"] }
# `extras` carries the blend shape names every exporter writes as
# `mesh.extras.targetNames`; without it the targets arrive unnamed.
gltf = { version = "1.4.1", features = ["import", "utils", "names", "extras"] }
serde_json = "1"
# Collada, 3MF and SVG are XML; a pull parser keeps the whole document off the
# heap, which matters for a scene file.
quick-xml = "0.37"
# meshoptimizer: vertex cache and fetch ordering, and the simplifier that
# generates LODs. Compiles C, like basis-universal already does.
meshopt = "0.6"
# Draco decoding, pure Rust - no C++ toolchain, unlike basis-universal. Decode
# only: nothing here writes compressed meshes.
draco-core = { version = "2.3", default-features = false, features = ["decoder", "edgebreaker_valence_decode", "legacy_bitstream_decode"] }
# KMZ and 3MF are zip archives. Deflate only: the other codecs are not used by
# either format and would be dead weight in the binary.
zip = { version = "2.2", default-features = false, features = ["deflate"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "hdr", "bmp", "tga", "webp", "tiff", "dds", "exr"] }
log = "0.4.34"
# zlib for compressed FBX arrays and KTX2 supercompression.
miniz_oxide = "0.8.9"
# KTX2 zstd supercompression.
ruzstd = "0.9.0"
# Basis Universal transcoder (ETC1S / UASTC) and CPU fallback block decoding.
basis-universal = { version = "0.3.1", optional = true }
texture2ddecoder = "0.1.2"
# Same naga as wgpu: validates custom shaders and translates GLSL hooks to WGSL.
naga = { version = "30.0.1", features = ["wgsl-in", "wgsl-out", "glsl-in"] }
pollster = "1.0.1"
raw-window-handle = "0.6.2"
thiserror = "2.0.20"
wgpu = "30.0.1"
gilrs = { version = "0.11.2", optional = true }
ab_glyph = "0.2.32"
rapier3d = "0.35.3"
cpal = { version = "0.18.2", optional = true }
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "ogg", "vorbis", "mp3", "flac"] }
openxr = { version = "0.21.1", optional = true }

# Native windows; Android hosts own their activity, so winit is left out there.
[target.'cfg(not(any(target_os = "android", target_os = "emscripten")))'.dependencies]
winit = "0.30.13"

[dev-dependencies]
# The compression tests encode real ETC1S / UASTC data.
basis-universal = "0.3.1"
# The Draco test encodes a mesh so it has something real to decode. The library
# itself ships decode only; the encoder is here and nowhere else.
draco-core = { version = "2.3", default-features = false, features = ["encoder", "decoder", "edgebreaker_valence_encode", "edgebreaker_valence_decode"] }
