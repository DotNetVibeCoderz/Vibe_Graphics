[package]
name = "threenet-core"
description = "Three.Net native core engine (wgpu based renderer, scene graph, asset pipeline)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "threenet_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["gltf-lights"]
# Imports KHR_lights_punctual lights from glTF files.
gltf-lights = ["gltf/KHR_lights_punctual"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
env_logger = "0.11.11"
glam = { version = "0.33.7", features = ["bytemuck"] }
gltf = { version = "1.4.1", features = ["import", "utils", "names"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "hdr", "bmp", "tga"] }
log = "0.4.34"
# zlib for compressed FBX arrays and KTX2 supercompression.
miniz_oxide = "0.8.9"
# KTX2 zstd supercompression.
ruzstd = "0.9.0"
# Basis Universal transcoder (ETC1S / UASTC) and CPU fallback block decoding.
basis-universal = "0.3.1"
texture2ddecoder = "0.1.2"
# Same naga as wgpu: validates custom shaders and translates GLSL hooks to WGSL.
naga = { version = "30.0.1", features = ["wgsl-in", "wgsl-out", "glsl-in"] }
pollster = "1.0.1"
raw-window-handle = "0.6.2"
thiserror = "2.0.20"
wgpu = "30.0.1"
winit = "0.30.13"
gilrs = "0.11.2"
ab_glyph = "0.2.32"
rapier3d = "0.35.3"
cpal = "0.18.2"
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "ogg", "vorbis", "mp3", "flac"] }
openxr = "0.21.1"

[dev-dependencies]
# The compression tests encode real ETC1S / UASTC data.
basis-universal = "0.3.1"
