[workspace]
resolver = "3"
members = ["threenet-core"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
authors = ["Gravicode Studios"]
repository = "https://github.com/DotNetVibeCoderz/Vibe_Graphics"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
